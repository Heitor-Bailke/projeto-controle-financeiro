services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Configure JWT_REFRESH_SECRET no arquivo .env}
      DATABASE_URL: postgres://contas:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}@db:5432/fluxo_financeiro
      CORS_ORIGIN: ${CORS_ORIGIN:?Configure CORS_ORIGIN no arquivo .env}
      FRONTEND_URL: ${FRONTEND_URL:?Configure FRONTEND_URL no arquivo .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-HB TECH SOLUTIONS <no-reply@hbtechsolutions.com>}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluxo_financeiro
      POSTGRES_USER: contas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
